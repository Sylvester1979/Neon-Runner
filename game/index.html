<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="NEON RUNNER - 80s Cyberpunk Endless Runner">
    <title>NEON RUNNER</title>
    <link rel="stylesheet" href="style.css">

    <!-- CRITICAL: Fix Electron dragEvent error BEFORE Phaser loads -->
    <script>
        window.dragEvent = undefined;
        window.addEventListener('error', function(e) {
            if (e.message && e.message.includes('dragEvent')) {
                e.preventDefault();
                console.log('Suppressed dragEvent error');
            }
        }, true);
    </script>
</head>
<body>
    <div id="loading-screen">
        <h1 class="glitch" data-text="NEON RUNNER">NEON RUNNER</h1>
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
        <p>LOADING...</p>
    </div>

    <div id="game-container"></div>

    <!-- Phaser 3 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>

    <!-- Game Scripts -->
    <script src="src/AudioManager.js"></script>
    <script src="src/ParticleSystem.js"></script>
    <script src="src/Player.js"></script>
    <script src="src/ObstacleManager.js"></script>
    <script src="src/EraManager.js"></script>
    <script src="src/UI.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
